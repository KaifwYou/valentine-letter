<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Interactive Valentine Letter</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#1d0b16;
      --card:#fff5f8;
      --accent:#ff4567;
      --muted:#f3d6dc;
      --glass: rgba(255,255,255,0.06);
      --radius:20px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Poppins,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(255,80,120,0.06), transparent),
                  radial-gradient(1000px 400px at 90% 90%, rgba(120,80,200,0.04), transparent),
                  var(--bg);
      color:#2b1020;
      -webkit-font-smoothing:antialiased;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px;
      overflow:hidden;
    }

    /* Soft hearts background */
    .bg-hearts{position:absolute;inset:0;pointer-events:none;opacity:0.45}
    .bg-hearts i{position:absolute;display:block;width:18px;height:18px;background:var(--accent);transform:rotate(45deg);border-radius:4px;opacity:0.25;filter:blur(1px)}

    /* Center stage */
    .stage{position:relative;z-index:5;max-width:960px;width:100%;display:grid;grid-template-columns:1fr 420px;gap:32px;align-items:center}

    /* Left: decorative message and controls */
    .panel{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));padding:28px;border-radius:18px;backdrop-filter:blur(6px);box-shadow:0 8px 30px rgba(0,0,0,0.45)}
    .title{display:flex;align-items:center;gap:12px}
    .logo-heart{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#ff7c9a);display:grid;place-items:center;color:white;font-weight:700;font-size:22px}
    h1{margin:0;font-size:20px}
    p.lead{color:#ffdbe3;margin-top:10px;line-height:1.45}

    .controls{display:flex;gap:8px;margin-top:18px}
    button{background:var(--accent);color:white;border:0;padding:10px 14px;border-radius:12px;cursor:pointer;font-weight:600}
    button.secondary{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--card);}
    .muted{color:rgba(255,255,255,0.55);font-size:13px;margin-top:12px}

    /* Right: envelope + letter */
    .envelope-wrap{display:grid;place-items:center}
    .envelope{width:360px;height:250px;position:relative;perspective:1000px}
    .env-body{position:absolute;inset:0;background:linear-gradient(180deg,var(--card),#ffeef4);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,0.35);overflow:hidden;transform-origin:top center;transition:transform 700ms cubic-bezier(.2,.85,.2,1)}
    .env-flap{position:absolute;top:-46px;left:0;right:0;height:160px;background:linear-gradient(180deg,#ff9db0,#ff5a76);clip-path:polygon(0 100%,50% 0,100% 100%);border-radius:20px;transform-origin:top center;transition:transform 700ms cubic-bezier(.2,.85,.2,1);box-shadow:0 8px 20px rgba(0,0,0,0.25)}
    .env-sticker{position:absolute;left:14px;bottom:14px;background:var(--muted);padding:8px 10px;border-radius:10px;font-weight:600;color:#6a2b39;font-size:13px}

    /* Open state */
    .envelope.open .env-flap{transform:translateY(-40px) rotateX(180deg)}
    .envelope.open .env-body{transform:translateY(20px)}

    /* Letter */
    .letter{position:absolute;left:16px;right:16px;top:40px;bottom:16px;background:linear-gradient(180deg,#fff,#fff3f8);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 1px 0 rgba(0,0,0,0.02)}
    .letter .to{font-family:'Dancing Script',cursive;font-size:28px;color:var(--accent);}
    .letter .body{flex:1;overflow:auto;font-size:15px;color:#703244;line-height:1.5}
    .letter .signature{align-self:flex-end;margin-top:6px;font-weight:600}

    /* Type cursor */
    .typed{white-space:pre-wrap}
    .cursor{display:inline-block;width:10px;height:18px;background:#703244;margin-left:6px;vertical-align:middle;animation:blink 1s steps(2) infinite}
    @keyframes blink{50%{opacity:0}} 

    /* small helpers */
    .actions{display:flex;gap:8px;align-items:center}
    .icon-btn{background:transparent;border:0;padding:8px;border-radius:10px;cursor:pointer;display:inline-grid;place-items:center}

    /* responsive */
    @media (max-width:880px){.stage{grid-template-columns:1fr;max-width:620px}.envelope{width:320px;height:220px}}

    /* confetti canvas overlay */
    #confetti{position:fixed;inset:0;pointer-events:none;z-index:9}
  </style>
</head>
<body>
  <div class="bg-hearts" aria-hidden="true">
    <!-- decorative hearts generated by JS -->
  </div>

  <div class="stage">
    <div class="panel">
      <div class="title">
        <div class="logo-heart">❤</div>
        <div>
          <h1>Interactive Valentine Letter</h1>
          <div class="muted">ILOVEYOUUUU!!</div>
        </div>
      </div>

      <p class="lead">Haii imut maaf ya cuman bisa ngasih ini doang buat valentine, love you for the millionth time mwahh</p>

      <div class="controls">
        <button id="openBtn">Open / Close</button>
        <button class="secondary" id="replayBtn">Replay Typing</button>
        <button class="secondary" id="confettiBtn">Confetti</button>
        <button class="secondary" id="printBtn">Print</button>
      </div>

      <div style="margin-top:14px" class="muted">Pro Tip: I LOVEEEE YOUUUU SO MUCHHH</div>
    </div>

    <div class="envelope-wrap">
      <div class="envelope" id="envelope" role="button" aria-label="Valentine envelope">
        <div class="env-flap" id="envFlap"></div>
        <div class="env-body">
          <div class="letter">
            <div class="to" id="toLine">For my love,</div>
            <div class="body"><div id="typed" class="typed"></div><span class="cursor" id="cursor"></span></div>
            <div class="signature" id="signature">— Yours</div>
            <div class="env-sticker">Sealed with a heart</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <canvas id="confetti"></canvas>

  <script>
    /* ---------- Editable content ---------- */
    // Change recipient name, letter text, and signature here.
    const RECIPIENT = 'My Love';
    const LETTER_TEXT = `Aku tuh honestly nggak ngerti ya, kenapa everytime I see kamu, my heart langsung kayak buffering sebentar terus boom — full signal to you.

It feels like aku lagi stuck di playlist yang cuma ada satu lagu: “about you.” And trust me, I don’t mind pressing repeat all day.

Kamu tuh kayak vibe yang bikin aku lupa deadlines, lupa drama, lupa dunia. Pokoknya, kalau ada kamu, it’s like everything suddenly makes sense.

So… boleh nggak aku jadi alasan kecil kenapa kamu senyum hari ini?`;
    const SIGNATURE = '— Always, Kai';

    /* ---------- End editable content ---------- */

    // DOM refs
    const envelope = document.getElementById('envelope');
    const openBtn = document.getElementById('openBtn');
    const replayBtn = document.getElementById('replayBtn');
    const confettiBtn = document.getElementById('confettiBtn');
    const printBtn = document.getElementById('printBtn');
    const typedEl = document.getElementById('typed');
    const cursor = document.getElementById('cursor');
    const toLine = document.getElementById('toLine');
    const signature = document.getElementById('signature');

    toLine.textContent = `For ${RECIPIENT},`;
    signature.textContent = SIGNATURE;

    // typing effect
    let typingTimer = null;
    function typeText(text, el, speed=28){
      cancelTyping();
      el.textContent = '';
      cursor.style.display = 'inline-block';
      let i=0;
      typingTimer = setInterval(()=>{
        el.textContent += text.charAt(i);
        i++;
        if(i>=text.length){
          cancelTyping();
          cursor.style.display = 'none';
        }
      }, speed);
    }
    function cancelTyping(){ if(typingTimer){ clearInterval(typingTimer); typingTimer=null; } }

    // envelope open/close
    let isOpen=false;
    function toggleEnvelope(force){
      isOpen = typeof force === 'boolean' ? force : !isOpen;
      envelope.classList.toggle('open', isOpen);
      if(isOpen){
        // small delay so letter is visible then start typing
        setTimeout(()=> typeText(LETTER_TEXT, typedEl), 420);
        startHearts();
      } else {
        cancelTyping();
        typedEl.textContent='';
        cursor.style.display='none';
        stopHearts();
      }
    }

    openBtn.addEventListener('click', ()=> toggleEnvelope());
    envelope.addEventListener('click', ()=> toggleEnvelope());

    replayBtn.addEventListener('click', ()=>{
      if(!isOpen) toggleEnvelope(true);
      // restart typing from top
      typeText(LETTER_TEXT, typedEl);
    });

    printBtn.addEventListener('click', ()=>{
      // print only the letter area for a cleaner print
      const letterHTML = document.querySelector('.letter').outerHTML;
      const printWindow = window.open('', '', 'width=650,height=780');
      printWindow.document.write('<html><head><title>Valentine Letter</title>');
      printWindow.document.write('<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">');
      printWindow.document.write('<style>body{font-family:Poppins,Arial;margin:40px;color:#6b2b3a} .letter{width:520px;padding:30px;border-radius:10px;background:#fff;border:1px solid #f1d6de}</style>');
      printWindow.document.write('</head><body>');
      printWindow.document.write(letterHTML);
      printWindow.document.write('</body></html>');
      printWindow.document.close();
      setTimeout(()=>printWindow.print(),200);
    });

    // heart background generator
    const bgHearts = document.querySelector('.bg-hearts');
    let heartsInterval=null;
    function startHearts(){
      // create many floating hearts around
      for(let i=0;i<28;i++){ const el=document.createElement('i');
        const size=8+Math.random()*22; el.style.width = size+'px'; el.style.height=size+'px';
        el.style.left = Math.random()*100+'%'; el.style.top = Math.random()*100+'%';
        el.style.opacity = (0.12+Math.random()*0.5).toFixed(2);
        el.style.transform = `rotate(${Math.random()*80-40}deg)`;
        bgHearts.appendChild(el);
      }
      heartsInterval = setInterval(()=>{
        const el=document.createElement('i');
        const size=8+Math.random()*22; el.style.width = size+'px'; el.style.height=size+'px';
        el.style.left = Math.random()*100+'%'; el.style.top = Math.random()*100+'%';
        el.style.opacity = (0.08+Math.random()*0.45).toFixed(2);
        el.style.transform = `rotate(${Math.random()*80-40}deg)`;
        bgHearts.appendChild(el);
        if(bgHearts.children.length>80) bgHearts.removeChild(bgHearts.firstChild);
      },900);
    }
    function stopHearts(){ clearInterval(heartsInterval); heartsInterval=null; while(bgHearts.firstChild) bgHearts.removeChild(bgHearts.firstChild); }

    // confetti (simple particle system)
    const confettiCanvas = document.getElementById('confetti');
    const ctx = confettiCanvas.getContext('2d');
    let confettiActive=false; let confettiParticles=[]; let confettiRaf=null;
    function resizeCanvas(){ confettiCanvas.width = innerWidth; confettiCanvas.height = innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function spawnConfetti(num=80){
      confettiParticles = [];
      const colors = ['#ff5a76','#ff9db0','#ffd6e0','#ffc0c8','#ff7c9a'];
      for(let i=0;i<num;i++){
        confettiParticles.push({x:Math.random()*confettiCanvas.width,y:-20,vy:2+Math.random()*5, vx:(Math.random()-0.5)*3, rot:Math.random()*360, size:6+Math.random()*10, color:colors[Math.floor(Math.random()*colors.length)],d:Math.random()*40});
      }
    }
    function runConfetti(){
      ctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
      for(let p of confettiParticles){
        p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.rot += 6;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
        ctx.fillStyle = p.color; ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6);
        ctx.restore();
      }
      confettiParticles = confettiParticles.filter(p=>p.y < confettiCanvas.height + 40);
      if(confettiParticles.length===0){ stopConfetti(); return; }
      confettiRaf = requestAnimationFrame(runConfetti);
    }
    function startConfetti(){ if(confettiActive) return; confettiActive=true; spawnConfetti(110); runConfetti(); }
    function stopConfetti(){ confettiActive=false; if(confettiRaf) cancelAnimationFrame(confettiRaf); confettiRaf=null; ctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height); }

    confettiBtn.addEventListener('click',()=>{ if(confettiActive) stopConfetti(); else startConfetti(); });

    // initial polite hint (open once automatically)
    setTimeout(()=>{
      toggleEnvelope(true);
      setTimeout(()=> toggleEnvelope(false), 4200);
    }, 800);

    // accessibility: allow Enter/Space to activate
    envelope.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' ') toggleEnvelope(); });

    // expose small API for users to quickly change text via console if they want
    window.VALENTINE = {setRecipient:(r)=>{toLine.textContent=`For ${r},`}, setText:(t)=>{LETTER_TEXT = t}, setSignature:(s)=>{signature.textContent=s}};
  </script>
</body>
</html>
